###############################################################################
# FARMING TRASH MOBS
# Total games won on weekdays.
###############################################################################
- id: badge_won_weekday
  type: badge
  category: 'Domination'
  subcategory: 'Work-life balance'
  name: 'Farming Trash Mobs'
  description: 'Total games won on weekdays.'
  flavor:
    quote: 'Loot table: +8 ELO, 0 XP, mild wrist pain.'
    author: 'MMO Patch Notes'
  config:
    metric_key: 'is_weekday_win'
    required_value: true
    is_hidden: false
    tiers:
      - name: 'stone'
        amount: 1
        flavor:
          text: 'Killed your first 1-health rat in the starting village.'

      - name: 'pawn'
        amount: 10
        flavor:
          player_quote: 'Where is the auto-battle button?'

      - name: 'knight'
        amount: 50
        flavor:
          text: 'Low drop rate on ELO today, but the daily grind continues.'

      - name: 'bishop'
        amount: 150
        flavor:
          text: 'Your opponent fell for a basic tactical pattern. Pure mob AI.'

      - name: 'rook'
        amount: 400
        flavor:
          player_quote: 'I have been clearing this dungeon since 9 AM.'

      - name: 'queen'
        amount: 1000
        flavor:
          text: 'Congratulations, you have reached max level in weekday slacking.'

      - name: 'king'
        amount: 2500
        flavor:
          text: 'The boss mob (your manager) still hasn''t noticed.'

      - name: 'immortal'
        amount: 5000
        flavor:
          text: 'You have farmed enough weekday trash mobs to populate an entire server.'

      - name: 'legend'
        amount: 10000
        flavor:
          text: 'Touch grass? No, the spawn rate for rating points is better right here.'



###############################################################################
# MERCURY IN RETROGRADE
