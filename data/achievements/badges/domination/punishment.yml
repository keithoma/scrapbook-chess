# Domination / Punishment

- id: badge_punish_mistakes
  type: badge
  category: 'Domination'
  subcategory: 'Punishment'
  name: 'Customer Feedback'
  description: 'Punish opponents mistakes.'
  flavor:
    text: Thank you for your move. We have identified an issue.
  config:
    metric_key: 'opponent_mistakes_punished'
    is_hidden: false
    analysis_required: true
    retention_chance_slack: 0.02
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: A prompt and constructive response.

      - name: 'knight'
        amount: 2
        flavor:
          text: Your opponent has received another actionable suggestion.

      - name: 'bishop'
        amount: 3
        flavor:
          text: The feedback loop is becoming expensive.

      - name: 'rook'
        amount: 4
        flavor:
          text: You are developing a reputation for reading the error messages.

      - name: 'queen'
        amount: 5
        flavor:
          text: The opponent has been advised to review their previous move.

      - name: 'king'
        amount: 6
        flavor:
          text: Your quality assurance process is now visible on the board.

      - name: 'immortal'
        amount: 7
        flavor:
          text: The suggestion box has been replaced by a complaint department.

      - name: 'legend'
        amount: 8
        flavor:
          text: Thank you for helping us improve your opponent's position. In reverse.

- id: badge_punish_blunders
  type: badge
  category: 'Domination'
  subcategory: 'Punishment'
  name: 'Find Out'
  description: 'Punish opponents blunders.'
  flavor:
    text: The second half of the experiment.
  config:
    metric_key: 'opponent_blunders_punished'
    is_hidden: false
    analysis_required: true
    retention_chance_slack: 0.02
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: An immediate and educational consequence.

      - name: 'knight'
        amount: 2
        flavor:
          text: The opponent has repeated the experiment under identical conditions.

      - name: 'bishop'
        amount: 3
        flavor:
          text: You are accumulating a useful body of evidence.

      - name: 'rook'
        amount: 4
        flavor:
          text: The hypothesis has become difficult to defend.

      - name: 'queen'
        amount: 5
        flavor:
          text: Your response has been peer reviewed by the engine.

      - name: 'king'
        amount: 6
        flavor:
          text: The opponent would like to retract the previous move.

      - name: 'immortal'
        amount: 7
        flavor:
          text: The demonstration now requires protective eyewear.

      - name: 'legend'
        amount: 8
        flavor:
          text: Further research is unlikely to change the conclusion.
