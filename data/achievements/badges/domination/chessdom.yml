###############################################################################
# LIGHTENING
# Win a game with always having more time than the opponent.
###############################################################################
- id: badge_time_advantage
  type: badge
  category: 'Domination'
  subcategory: 'ChessDom'
  name: 'Lightening'
  description: 'Win a game with always having more time than the opponent.'
  flavor:
    player_quote: 'Nothing personal.'
  config:
    metric_key: 'is_time_advantage_win'
    required_value: true
    is_hidden: false
    tiers:
      - name: 'stone'
        amount: 1
        flavor:
          text: A small reserve of unspent panic.

      - name: 'pawn'
        amount: 1
        flavor:
          text: You have finished thinking before the other person has finished worrying.

      - name: 'knight'
        amount: 2
        flavor:
          text: The clock is on your side. For once, literally.

      - name: 'bishop'
        amount: 3
        flavor:
          text: Your opponent is paying interest on every decision.

      - name: 'rook'
        amount: 4
        flavor:
          text: You brought a schedule to a thinking contest.

      - name: 'queen'
        amount: 5
        flavor:
          text: There is time to double-check. You even used some of it.

      - name: 'king'
        amount: 6
        flavor:
          text: Their clock has started making eye contact with yours.

      - name: 'immortal'
        amount: 7
        flavor:
          text: You are now technically the time control.

      - name: 'legend'
        amount: 8
        flavor:
          text: Congratulations. You have won an argument with a countdown.

###############################################################################
#
# Win a time scramble
###############################################################################
- id: badge_time_scramble
  type: badge
  category: 'Domination'
  subcategory: 'ChessDom'
  name: 'Clutch'
  description: 'Win a time scramble.'
  flavor:
    text: There is no time to explain. There is barely time to move.
  config:
    metric_key: 'is_time_scramble_win'
    required_value: true
    is_hidden: false
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: The final seconds had surprisingly strong opinions.

      - name: 'knight'
        amount: 2
        flavor:
          text: Your pulse is now a permitted increment.

      - name: 'bishop'
        amount: 3
        flavor:
          text: You have discovered an extra gear. It appears to be panic.

      - name: 'rook'
        amount: 4
        flavor:
          text: The clock tried to end the conversation. You had one more thing.

      - name: 'queen'
        amount: 5
        flavor:
          text: Your hands are filing a separate game report.

      - name: 'king'
        amount: 6
        flavor:
          text: The position was complicated. The deadline was not.

      - name: 'immortal'
        amount: 7
        flavor:
          text: You are developing a suspiciously calm relationship with zero.

      - name: 'legend'
        amount: 8
        flavor:
          text: The flag has learned to hesitate.
    max_seconds: 30
