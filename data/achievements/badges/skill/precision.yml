# Skill / Precision

###############################################################################
# SECTION 3: PRECISION
###############################################################################
- id: badge_perfect_eval
  type: badge
  category: 'Skill'
  subcategory: 'Precision'
  name: 'Always on Brand'
  description: 'Win a game with always being above 0.0 as white, or below +0.5 as black.'
  flavor:
    text: The evaluation bar never had to revise its opening statement.
  config:
    metric_key: 'is_perfect_eval_win'
    required_value: true
    is_hidden: false
    analysis_required: true
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: A consistent narrative, for once.

      - name: 'knight'
        amount: 2
        flavor:
          text: The graph has declined to provide a plot twist.

      - name: 'bishop'
        amount: 3
        flavor:
          text: Your opponent is waiting for the part where the advantage changes sides.

      - name: 'rook'
        amount: 4
        flavor:
          text: The evaluation bar has found a comfortable seat.

      - name: 'queen'
        amount: 5
        flavor:
          text: You are making the recap unnecessarily easy to write.

      - name: 'king'
        amount: 6
        flavor:
          text: The engine's opinion has become repetitive.

      - name: 'immortal'
        amount: 7
        flavor:
          text: Your advantage has survived every scheduled checkpoint.

      - name: 'legend'
        amount: 8
        flavor:
          text: A flat story arc. An excellent result.

- id: badge_no_blunders
  type: badge
  category: 'Skill'
  subcategory: 'Precision'
  name: 'Adult Supervision'
  description: 'Win a game without any blunders.'
  flavor:
    text: A winning game with no major incident reports.
  config:
    metric_key: 'is_no_blunder_win'
    required_value: true
    is_hidden: false
    analysis_required: true
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: Nobody gave the queen an unsupervised afternoon.

      - name: 'knight'
        amount: 2
        flavor:
          text: Two games. The safety briefing is paying off.

      - name: 'bishop'
        amount: 3
        flavor:
          text: Your pieces have noticed the improvement in working conditions.

      - name: 'rook'
        amount: 4
        flavor:
          text: The big red button remains unpressed.

      - name: 'queen'
        amount: 5
        flavor:
          text: You are becoming a difficult source of highlight clips.

      - name: 'king'
        amount: 6
        flavor:
          text: The opponent waited for a catastrophe. There was a scheduling conflict.

      - name: 'immortal'
        amount: 7
        flavor:
          text: Your queen has stopped checking the exits.

      - name: 'legend'
        amount: 8
        flavor:
          text: Boring, dependable, and one point richer.

- id: badge_no_mistakes_blunders
  type: badge
  category: 'Skill'
  subcategory: 'Precision'
  name: 'Terms of Perfection'
  description: 'Win a game without any mistakes and blunders.'
  flavor:
    text: 'Read the small print: inaccuracies are allowed.'
  config:
    metric_key: 'is_flawless_win'
    required_value: true
    is_hidden: false
    analysis_required: true
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: The quality department has approved this win.

      - name: 'knight'
        amount: 2
        flavor:
          text: Two wins without a strongly worded engine annotation.

      - name: 'bishop'
        amount: 3
        flavor:
          text: Your moves are beginning to arrive with documentation.

      - name: 'rook'
        amount: 4
        flavor:
          text: The opponent's counterplay did not pass review.

      - name: 'queen'
        amount: 5
        flavor:
          text: You have temporarily defeated your own decision-making process.

      - name: 'king'
        amount: 6
        flavor:
          text: The engine has run out of useful ways to sound disappointed.

      - name: 'immortal'
        amount: 7
        flavor:
          text: Your position has an unusually clean inspection record.

      - name: 'legend'
        amount: 8
        flavor:
          text: Please enjoy this certificate before your next game.
