###############################################################################
# DELULU MONDAY
# Total games played on Mondays.
###############################################################################
- id: badge_played_monday
  type: badge
  category: 'Veterancy'
  subcategory: 'DailyScape'
  name: 'Delulu Monday'
  description: 'Total games played on Mondays.'
  compliance_filters:
    - 'resolution' # toxic productivity culture
    - 'ELO' # rating elitism
    - 'Monday' # work dread
    - 'boss' # capitalist hierarchy
    - 'fresh' # hygiene shaming
  flavor:
    quote: 'This is the week I hit 1800.'
    author: 'Every 800 ELO player at 8:00 AM'
  config:
    metric_key: 'day_of_week'
    required_value: 'monday'
    is_hidden: false
    tiers:
      - name: 'stone'
        amount: 1
        flavor:
          text: 'Step 1: Buy a $50 opening course at 8:00 AM.'

      - name: 'pawn'
        amount: 8 # -8 ELO lost on first game
        flavor:
          text: 'Step 2: Blunder your Queen on move 6 at 8:15 AM.'

      - name: 'knight'
        amount: 40
        flavor:
          player_quote: "I'm tilting, but it's fine because it's a fresh week."

      - name: 'bishop'
        amount: 100
        flavor:
          text: 'Motivation 404: Course knowledge not found.'

      - name: 'rook'
        amount: 250
        flavor:
          text: 'Welp, back to where we started last Monday.'

      - name: 'queen'
        amount: 500
        flavor:
          text: '1800 is just a social construct anyway.'

      - name: 'king'
        amount: 1000
        flavor:
          player_quote: 'Next Monday for sure.'

      - name: 'immortal'
        amount: 3000 # hard target for single-day mileage
        flavor:
          text: 'You have spent roughly two decades worth of Monday mornings losing rating points.'

      - name: 'legend'
        amount: 7000
        flavor:
          text: 'The delusion is no longer a phase. It is your permanent lifestyle.'

