###############################################################################
# WITCHING HOUR (00:00 - 04:00)
# Total games played between midnight and 4 AM.
###############################################################################
- id: badge_played_time_00_04
  type: badge
  category: 'Veterancy'
  subcategory: 'Chronotype'
  name: 'Witching Hour'
  description: 'Total games played between 00:00 and 04:00.'
  flavor:
    quote: 'Just one more win before bed.'
    author: 'Famous last words at 3:14 AM'
  config:
    metric_key: 'time_block'
    required_value: '00_04'
    is_hidden: false
    tiers:
      - name: 'stone'
        amount: 1
        flavor:
          text: 'Entering the dark realm of late-night tilt.'

      - name: 'pawn'
        amount: 10
        flavor:
          player_quote: "If I win this one, I'll go to sleep. (Spoiler: You lost)."

      - name: 'knight'
        amount: 50
        flavor:
          text: 'Your brain function is down to 12%, but your queue button finger is going strong.'

      - name: 'bishop'
        amount: 150
        flavor:
          text: 'Staring at the ceiling at 3:30 AM seeing phantom Knight forks.'

      - name: 'rook'
        amount: 400
        flavor:
          text: 'You no longer calculate moves; you just react to colors on the screen.'

      - name: 'queen'
        amount: 1000
        flavor:
          text: 'The birds outside have started singing. That is your cue to cry.'

      - name: 'king'
        amount: 2500
        flavor:
          text: 'You have spent 2,500 unholy hours ruining your REM sleep schedule.'

      - name: 'immortal'
        amount: 6000
        flavor:
          text: 'The darkness is your native habitat. You are the nocturnal lord of blunders.'

      - name: 'legend'
        amount: 12000
        flavor:
          text: "You haven't slept before 4 AM since the Obama administration."

