# Resilience / Comebacks

###############################################################################
# SECTION 2: COMEBACKS
###############################################################################
- id: badge_comeback_1_5_late
  type: badge
  category: 'Resilience'
  subcategory: 'Comebacks'
  name: 'The Long Con'
  description: 'Be down 1.5 or more after the opening and the mid game and still win.'
  flavor:
    text: The opening was bad. The middlegame confirmed it. The result disagreed.
  config:
    metric_key: 'is_comeback_from_1_5_down_late'
    required_value: true
    is_hidden: false
    analysis_required: true
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: A delayed response to several reasonable concerns.

      - name: 'knight'
        amount: 2
        flavor:
          text: Your opponent has begun checking the last page first.

      - name: 'bishop'
        amount: 3
        flavor:
          text: The deficit was present at both inspections. The win was not impressed.

      - name: 'rook'
        amount: 4
        flavor:
          text: You are developing a very unreliable relationship with foreshadowing.

      - name: 'queen'
        amount: 5
        flavor:
          text: The graph would like an explanation for its ending.

      - name: 'king'
        amount: 6
        flavor:
          text: Your opponent's winning plan has outlived its warranty.

      - name: 'immortal'
        amount: 7
        flavor:
          text: You now specialize in games that should have been shorter.

      - name: 'legend'
        amount: 8
        flavor:
          text: The opening and middlegame have filed a joint complaint.

- id: badge_comeback_2_0_fast
  type: badge
  category: 'Resilience'
  subcategory: 'Comebacks'
  name: 'Speedrun the Apology'
  description: 'Be down 2.0 or more after the opening and win in 20 moves after the opening.'
  flavor:
    text: A bad opening, followed by an unusually efficient correction.
  config:
    metric_key: 'is_comeback_from_2_0_down_fast'
    required_value: true
    is_hidden: false
    analysis_required: true
    tiers:
      - name: 'pawn'
        amount: 1
        flavor:
          text: The disadvantage barely had time to unpack.

      - name: 'knight'
        amount: 2
        flavor:
          text: Your opponent was still naming their extra material.

      - name: 'bishop'
        amount: 3
        flavor:
          text: The comeback has developed a turnaround target.

      - name: 'rook'
        amount: 4
        flavor:
          text: Please return the advantage within twenty moves of purchase.

      - name: 'queen'
        amount: 5
        flavor:
          text: Your bad openings now come with expedited support.

      - name: 'king'
        amount: 6
        flavor:
          text: The evaluation graph has requested a speed limit.

      - name: 'immortal'
        amount: 7
        flavor:
          text: The opponent's victory speech was still in draft.

      - name: 'legend'
        amount: 8
        flavor:
          text: You have optimized the most stressful part of being wrong.

